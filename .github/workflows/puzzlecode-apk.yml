name: PuzzleCode Android APK

on:
  push:
    branches: [puzzlecode-build]
    paths:
      - 'puzzlecode/**'
      - '.github/workflows/puzzlecode-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK command-line tools
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build fully from source
        working-directory: puzzlecode
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists and signature is valid
        run: |
          APK=puzzlecode/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -20

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleCode-Android-APK
          path: puzzlecode/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
